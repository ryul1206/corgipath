[package]
name = "corgipath-core"
description = "Core contracts (State, SearchSpace, Collision, Map) shared across all corgipath regimes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "corgipath_core"

[features]
default = []
# Opt-in serialization for trace events / paths so Python & other backends can
# consume them across the FFI boundary. Kept off the default path to keep the
# core dependency-light.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"
